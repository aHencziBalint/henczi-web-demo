<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henczi Web Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            max-width: 600px;
        }

        button {
            margin-top: 20px;
            padding: 14px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <section class="hero">
        <h1>Meine erste Website</h1>

        <p>
            Das ist mein erstes Webdesign-Testprojekt.
            Die Website wurde von mir selbst erstellt.
        </p>

        <button>Mehr erfahren</button>
    </section>

</body>
</html>
